<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevFlow · 需求到测试全链路</title>
<script>
  // 主题预涂装：避免刷新闪色
  (function () {
    var t = localStorage.getItem("df-theme") || "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/mermaid.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ── 顶栏 ─────────────────────────────────────── -->
  <header class="topbar">
    <button id="btnSidebar" class="icon-btn only-mobile" title="会话列表">≡</button>
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Dev<em>Flow</em></span>
      <span class="brand-sub">需求 → 测试 全链路</span>
    </div>

    <nav id="stepper" class="stepper" aria-label="流程进度"></nav>

    <div class="top-actions">
      <button id="btnHealth" class="chip" title="配置状态">
        <span class="dot" id="healthDot"></span><span id="healthText">检测中</span>
      </button>
      <button id="btnTheme" class="icon-btn" title="切换明暗主题">◐</button>
    </div>
  </header>
  <div id="flowbar" class="flowbar" hidden></div>

  <!-- 配置状态浮层 -->
  <div id="healthPop" class="health-pop hidden"></div>

  <div class="shell">

    <!-- ── 左栏：会话历史 ─────────────────────────── -->
    <aside id="sidebar" class="sidebar">
      <section class="panel grow">
        <div class="panel-title">
          历史会话 <span id="sessCount" class="count"></span>
          <span class="spacer"></span>
          <button id="btnNewChat" class="chip-btn" title="开始一个新的会话">＋ 新会话</button>
        </div>
        <ul id="sessions" class="sessions"><li class="sess-empty">加载中…</li></ul>
      </section>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- ── 主区：动态流 + 输入 ───────────────────── -->
    <main class="main">
      <div id="feed" class="feed"></div>

      <footer class="composer">
        <div id="cfgChips" class="cfg-chips hidden"></div>
        <div class="composer-meta">
          <span id="composerHint">输入需求，回车开始</span>
          <span id="composerTimer" class="mono"></span>
        </div>
        <div class="composer-box" id="composerBox">
          <button id="btnDoc" class="comp-btn" title="导入需求文档（.md / .txt / .docx）">⇪</button>
          <textarea id="chatInput" rows="1" placeholder="描述你的需求，回车开始全链路…"></textarea>
          <button id="btnCfg" class="comp-btn" title="运行配置（仅在新会话创建时生效）">⚙</button>
          <button id="btnSend" class="send" title="发送（Enter）" disabled>↑</button>
        </div>
        <input type="file" id="fileDoc" accept=".md,.txt,.docx" hidden>

        <!-- 运行配置弹层（须留在 composer 内：CSS 以它为定位锚，弹出在输入区上方） -->
        <div id="cfgPop" class="cfg-pop hidden">
          <div class="cfg-head">运行配置 <span class="label-hint">仅在新会话创建时生效</span></div>
          <div class="field">
            <label for="fRoot">project_root</label>
            <input id="fRoot" value="." spellcheck="false">
          </div>
          <div class="field">
            <label>目标模块 <span class="label-hint">回车添加</span></label>
            <div class="tags" id="tagModules"></div>
          </div>
          <div class="field">
            <label>边界场景 <span class="label-hint">回车添加</span></label>
            <div class="tags" id="tagEdges"></div>
          </div>
          <div class="field">
            <label>验收标准 <span class="label-hint">回车添加</span></label>
            <div class="tags" id="tagAccept"></div>
          </div>
          <div class="field">
            <label for="fCtx">项目背景</label>
            <input id="fCtx" value="桌面 GUI 计算器应用（tkinter）">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="fIoIn">输入约束</label>
              <input id="fIoIn" value="按钮点击与表达式">
            </div>
            <div class="field">
              <label for="fIoOut">输出约束</label>
              <input id="fIoOut" value="结果或错误提示">
            </div>
          </div>
          <div class="cfg-foot">
            <button id="btnCfgClear" class="chip-btn">清空配置</button>
            <button id="btnCfgSample" class="chip-btn">✦ 示例配置</button>
          </div>
        </div>
      </footer>
    </main>
  </div>
</div>

<!-- ── 门禁模态 ────────────────────────────────────── -->
<div id="gateModal" class="gate-overlay hidden" role="dialog" aria-modal="true">
  <div class="gate-panel">
    <header class="gate-head">
      <span class="gate-tag mono" id="gateTag">GATE</span>
      <div class="gate-head-text">
        <h3 id="gateTitle">确认</h3>
        <p id="gateSub" class="mono"></p>
      </div>
    </header>
    <div class="gate-body" id="gateBody"></div>
    <div class="gate-comment hidden" id="gateCommentWrap">
      <label for="gateComment">修改意见 <span class="label-hint">将回传给制图 / 代码生成，针对性修正</span></label>
      <textarea id="gateComment" rows="3" placeholder="例：除零分支没有覆盖负数输入；GUI 启动路径缺失…"></textarea>
    </div>
    <footer class="gate-foot" id="gateFooter">
      <button id="btnGatePeek" class="btn ghost">查看完整产物</button>
      <span class="spacer"></span>
      <button id="btnReject" class="btn danger">驳回</button>
      <button id="btnApprove" class="btn primary">通过</button>
      <button id="btnGateSubmit" class="btn danger hidden">提交意见并驳回</button>
    </footer>
  </div>
</div>

<!-- 门禁最小化悬浮签 -->
<button id="gatePill" class="gate-pill hidden">
  <span class="pulse"></span><span id="gatePillText">门禁待决策</span>
</button>

<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
